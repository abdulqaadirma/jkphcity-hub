<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jkpg City Guide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Jkpg City Guide</h1>
        <div id="auth-section">
            <div id="login-form">
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button onclick="login()">Login</button>
            </div>
            <div id="user-info" style="display: none;">
                <span id="welcome-message"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <main>
        <!-- Admin Panel - Only shows Create button initially -->
        <div id="admin-panel" style="display: none;">
            <h2>Admin Panel</h2>
            <button id="show-create-btn" onclick="toggleCreateForm()" class="admin-toggle-btn">+ Create New Venue</button>
            
            <!-- Create Form (hidden by default) -->
            <div id="create-form-container" style="display: none;">
                <h3>Add New Venue</h3>
                <form id="venue-form" class="admin-form">
                    <input type="text" id="venue-name" placeholder="Venue Name *" required>
                    <input type="text" id="venue-url" placeholder="URL">
                    <input type="text" id="venue-district" placeholder="District">
                    <input type="text" id="venue-category" placeholder="Category">
                    <input type="text" id="venue-phone" placeholder="Phone">
                    <textarea id="venue-description" placeholder="Description" rows="3"></textarea>
                    <div class="form-buttons">
                        <button type="submit" class="save-btn">Save Venue</button>
                        <button type="button" onclick="toggleCreateForm()" class="cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Edit Form Modal (hidden by default) -->
        <div id="edit-modal" style="display: none;" class="modal">
            <div class="modal-content">
                <h3>Edit Venue</h3>
                <form id="edit-form" class="admin-form">
                    <input type="hidden" id="edit-venue-id">
                    <input type="text" id="edit-venue-name" placeholder="Venue Name *" required>
                    <input type="text" id="edit-venue-url" placeholder="URL">
                    <input type="text" id="edit-venue-district" placeholder="District">
                    <input type="text" id="edit-venue-category" placeholder="Category">
                    <input type="text" id="edit-venue-phone" placeholder="Phone">
                    <textarea id="edit-venue-description" placeholder="Description" rows="3"></textarea>
                    <div class="form-buttons">
                        <button type="submit" class="save-btn">Update Venue</button>
                        <button type="button" onclick="closeEditModal()" class="cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

       <div id="filters">
            <button onclick="filterByDistrict('all')">All</button>
            <button onclick="filterByDistrict('Öster')">Öster</button>
            <button onclick="filterByDistrict('Väster')">Väster</button>
            <button onclick="filterByDistrict('Atollen')">Atollen</button>
            <button onclick="filterByDistrict('Tändsticksområdet')">Tändsticksområdet</button>

            <button onclick="sortVenues('az')">Sort A-Z</button>
            <button onclick="sortVenues('za')">Sort Z-A</button>
            <button onclick="sortVenues('district')">Sort by District</button>

            <input type="text" id="search" placeholder="Search venues..." onkeyup="searchVenues()">
        </div>

        <div id="venues-container"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
