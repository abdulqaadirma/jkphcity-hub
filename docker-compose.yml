version: '3.8'

services:
  db:
    build: ./database
    container_name: jkpg-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: jkpg_city
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jkpg-network
  
  backend:
    build: ./backend
    container_name: jkpg-backend
    restart: always
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: jkpg_city
      #JWT_SECRET: your_jwt_secret_key_here_change_this_in_production
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - jkpg-network
  
volumes:
  db_data:

networks:
  jkpg-network:
    driver: bridge